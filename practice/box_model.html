<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model Practice</title>
        <script src="../validate.js"></script>
<style>
#redbox{
background-color:red;
height:100px;
width:100px;
border:2px black solid;
background-clip:content-box;
margin-left:300px;
}
#bluebox{
 background-color:blue;
 height:100px;
 width:100px;
 border:2px black solid;
 padding:100px;
 background-clip:content-box;
 margin-left:400px;
}
#greenbox{
 background-color:green;
 height:100px;
 width:100px;
 border:2px black solid;
 background-clip:content-box;
 padding-left:20px;
}

#yellowbox{
 background-color:yellow;
 height:100px;
 width:100px;
 border:2px black solid;
 padding-top:40px;
 padding-left:20px;
 padding-right:20px;    
 background-clip:content-box;
 margin-left:300px;

}

#purplebox{
 background-color:purple;
 height:100px;
 width:100px;
 border:2px black solid;
 border-bottom: none;
 margin-left:198px;
 
 
} 
#transparentbox{
 height:100px;
 width:100px;
 border:2px black solid;
 margin-left:198px;
} 

</style>
    </head>
    <body>
        <h1>Look at them boxes</h1>
        <div id="redbox"></div>
        <div id="bluebox"></div>
        <div id="greenbox"></div>
        <div id="yellowbox"></div>
        <div id="purplebox"></div>
        <div id="transparentbox"></div>
    </body>
    
</html>
